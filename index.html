<title>DRP · STATE OF MIND — доступ по паролю</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--ink:#141414;--acc:#E17331;--cream:#E5DFD3;--muted:#99958D}
body{background:var(--bg);color:var(--cream);font-family:'Manrope',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:400px;text-align:center}
.brand{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:15px;color:#fff;margin-bottom:6px}
.brand b{color:var(--acc)}
.sub{color:var(--muted);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:36px}
form{display:flex;flex-direction:column;gap:14px}
input[type=password]{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:14px 16px;color:#fff;font-size:16px;text-align:center;letter-spacing:1px}
input[type=password]:focus{outline:none;border-color:var(--acc)}
button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:14px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--acc);font-size:13px;margin-top:14px;min-height:18px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
