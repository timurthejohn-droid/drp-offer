<title>DRP · STATE OF MIND — доступ по паролю</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--ink:#141414;--acc:#E17331;--cream:#E5DFD3;--muted:#99958D}
body{background:var(--bg);color:var(--cream);font-family:'Manrope',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:400px;text-align:center}
.brand{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:15px;color:#fff;margin-bottom:6px}
.brand b{color:var(--acc)}
.sub{color:var(--muted);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:36px}
form{display:flex;flex-direction:column;gap:14px}
input[type=password]{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:14px 16px;color:#fff;font-size:16px;text-align:center;letter-spacing:1px}
input[type=password]:focus{outline:none;border-color:var(--acc)}
button{background:var(--acc);color:#000;border:none;border-radius:6px;padding:14px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--acc);font-size:13px;margin-top:14px;min-height:18px}

#app{position:fixed;inset:0;display:none;background:#0a0a0a}
#app iframe{width:100%;height:100%;border:0;display:block;background:#0a0a0a}
.vbar{position:fixed;right:18px;bottom:18px;z-index:10;display:flex;gap:4px;padding:4px;background:rgba(18,18,18,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.vbar button{width:auto;background:transparent;color:rgba(255,255,255,.72);padding:9px 18px;border-radius:999px;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.vbar button:hover{opacity:1;color:#fff}
.vbar button.on{background:var(--acc);color:#000}
</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">

function show(d){
  document.querySelector('.box').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const urls = {}, fr = document.getElementById('fr'), btns = document.querySelectorAll('.vbar button');
  for (const k of ['v1', 'v2']) urls[k] = URL.createObjectURL(new Blob([d[k]], {type: 'text/html;charset=utf-8'}));
  const set = v => {
    fr.src = urls[v];
    btns.forEach(b => b.classList.toggle('on', b.dataset.v === v));
    history.replaceState(null, '', '#' + v);
    document.title = 'DRP · Оффер · STATE OF MIND — версия ' + v.slice(1);
  };
  btns.forEach(b => b.addEventListener('click', () => set(b.dataset.v)));
  set(location.hash === '#v1' ? 'v1' : 'v2');
}
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const f = document.getElementById('f'), pwEl = document.getElementById('pw'),
      err = document.getElementById('err'), btn = document.getElementById('btn');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; err.textContent = '';
  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pwEl.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64d(SALT), iterations:ITER, hash:'SHA-256'},
      keyMaterial, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(IV)}, key, b64d(BLOB));
    const html = new TextDecoder('utf-8').decode(plain);
    show(JSON.parse(html));
  } catch (ex) {
    err.textContent = 'Неверный пароль';
    btn.disabled = false;
  }
});
</script>
